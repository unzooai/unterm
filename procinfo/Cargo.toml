[package]
name = "procinfo"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
# Derive wezterm-dynamic conversions. Named `lua` while that was the only
# consumer; it is plain serialization.
default = ["dynamic"]
dynamic = ["dep:wezterm-dynamic"]

[dependencies]
libc.workspace = true
log.workspace = true
wezterm-dynamic = { workspace=true, optional = true, features=["std"]}

[target."cfg(windows)".dependencies]
ntapi.workspace = true
winapi = { workspace=true, features = [
    "handleapi",
    "memoryapi",
    "psapi",
    "processthreadsapi",
    "shellapi",
    "tlhelp32",
    # `windows.rs` has always used LocalFree/QueryFullProcessImageNameW from
    # here, but only ever compiled because some *other* crate in the workspace
    # switched the feature on and cargo unified it in. That made `cargo check
    # -p procinfo --target ...-windows-...` — the one cheap way to compile-check
    # this Windows-only file from a Mac or Linux box — fail on its own. Declare
    # what we actually use.
    "winbase",
]}

