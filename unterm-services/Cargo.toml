[package]
name = "unterm-services"
version = "0.1.0"
edition = "2021"
publish = false

# Unterm's own product services, which had been living inside the WezTerm GUI
# crate. None of them are about WezTerm: they are the instance registry, the
# agent cockpit, proxy control and command suggestion. Moving them here is what
# lets a second front end have them, and what takes them out of the crate that
# is being retired.

[features]
# Test helpers other crates need, kept out of shipped binaries.
test-support = []

[dependencies]
anyhow.workspace = true
log.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
config = { path = "../config" }
chrono = { workspace = true, features = ["clock"] }
uuid = { workspace = true, features = ["v4"] }
dirs-next.workspace = true
regex.workspace = true
base64.workspace = true
hostname.workspace = true
portable-pty.workspace = true
unterm-profile.workspace = true

[target."cfg(windows)".dependencies]
winapi = { workspace = true, features = ["handleapi", "processthreadsapi", "winnt", "synchapi", "errhandlingapi"] }
winreg.workspace = true

[dev-dependencies]
tempfile.workspace = true
