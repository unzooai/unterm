[package]
name = "unterm-app"
version.workspace = true
edition = "2021"
publish = false

# The terminal without WezTerm: next-core for the engine, unterm-render for
# the pixels, winit for the window. No wezterm-gui, no mux, no window crate.

[[bin]]
name = "unterm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono = { workspace = true, features = ["clock"] }
dirs-next.workspace = true
emojis.workspace = true
frecency.workspace = true
nucleo-matcher.workspace = true
rayon.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
parking_lot.workspace = true
log.workspace = true
env_logger = "0.10"
termwiz.workspace = true
portable-pty.workspace = true
image.workspace = true
base64.workspace = true
serde_json.workspace = true
unterm-engine = { path = "../unterm-engine" }
unterm-core = { path = "../unterm-core" }
unterm-agents.workspace = true
unterm-mcp = { path = "../unterm-mcp" }
unterm-services.workspace = true
unterm-profile.workspace = true
unterm-settings.workspace = true
unterm-render = { path = "../unterm-render" }
unterm-protocol.workspace = true
wgpu.workspace = true
winit = "0.30"
arboard = "3"
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true

[target.'cfg(windows)'.dependencies]
# Asking DWM to round the window's corners: a frameless window is not
# rounded by default, and square corners next to every other Windows 11
# window read as a window that did not finish loading.
winapi = { workspace = true, features = ["dwmapi", "windef", "minwindef", "winerror"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
