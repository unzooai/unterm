name: release-windows

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag override"
        required: false
      draft:
        description: "publish the release as a draft (for test dispatches; 'true'/'false')"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build:
    # x64 on the standard runner, arm64 on GitHub's native windows-11-arm
    # runner. Native (not cross) so each artifact runs on real hardware and
    # arm-specific issues surface in CI, not on a user's machine.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    env:
      RUSTUP_WINDOWS_PATH_ADD_BIN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"; fi
      - name: Verify the tag names the version being built
        shell: bash
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          want="${TAG_NAME#v}"
          have=$(awk '/^\[workspace.package\]/{f=1} f && /^version *=/{gsub(/[",]/,"",$3); print $3; exit}' Cargo.toml)
          if [ "$want" != "$have" ]; then
            echo "tag ${TAG_NAME} does not match the workspace version ${have}." >&2
            echo "A release whose artifacts disagree with their tag is the one" >&2
            echo "kind nobody can reason about afterwards; fix the bump or the tag." >&2
            exit 1
          fi
          echo "tag ${TAG_NAME} matches workspace version ${have}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p unterm-app -p unterm-cli -p unterm-core
      - name: Stage zip
        shell: bash
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
          OSTYPE: msys
          UNTERM_ARCH: ${{ matrix.arch }}
        run: ci/deploy.sh
      - name: Install WiX (as a .NET tool, the official WiX 6 distribution)
        shell: pwsh
        run: |
          # WiX 6 ships as the `wix` .NET global tool, not a standalone .exe.
          # Install it into a per-repo path that build-msi.ps1 already looks at
          # (.\.tools\), so the script doesn't need to know where it lives on
          # the runner.
          New-Item -ItemType Directory -Force .\.tools | Out-Null
          dotnet tool install --tool-path .\.tools wix --version 6.0.1
      - name: Build MSI
        shell: pwsh
        run: |
          # Read the whole file as one string so the regex can span lines —
          # the WXS has <Package on its own line, then Name, Manufacturer,
          # Version="…" on subsequent lines, so the per-line Select-String
          # we used before couldn't see them together.
          # The case-sensitive `-cmatch` makes sure we don't accidentally
          # bind to the XML declaration's lowercase `version="1.0"`.
          $wxs = Get-Content -Raw installer\Unterm.wxs
          if ($wxs -cmatch '<Package[^>]*?\bVersion="([0-9.]+)"') {
            $ver = $Matches[1]
          } else {
            throw "couldn't extract Package Version from installer\Unterm.wxs"
          }
          Write-Host "Package Version = $ver"
          pwsh -File ci\build-msi.ps1 -Version $ver -Arch ${{ matrix.arch }}
      - name: Verify Windows release artifacts
        shell: pwsh
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
          UNTERM_ARCH: ${{ matrix.arch }}
        run: |
          $zip = "Unterm-windows-$env:UNTERM_ARCH-$env:TAG_NAME.zip"
          $version = ($env:TAG_NAME).TrimStart([char]'v')
          $msi = "dist\Unterm-$version-$env:UNTERM_ARCH.msi"
          if (-not (Test-Path $zip)) {
            throw "missing Windows zip artifact: $zip"
          }
          if (-not (Test-Path $msi)) {
            throw "missing Windows MSI installer: $msi"
          }
          Write-Host "Verified Windows artifacts:"
          Write-Host "  $zip"
          Write-Host "  $msi"
          # Existence is not identity. Unpack both and ask the binaries what
          # version they are: a packaging script that stages a stale target\
          # directory produces a correctly-named archive full of the previous
          # release, and nothing else here would notice. The arm64 job runs on
          # an x64 runner, so only probe binaries this host can execute.
          $expected = $version
          Remove-Item -Recurse -Force probe -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath probe\zip -Force
          & msiexec /a $msi /qn "TARGETDIR=$PWD\probe\msi" | Out-Null
          Start-Sleep -Seconds 5
          if ($env:UNTERM_ARCH -eq "x64") {
            foreach ($stage in @("probe\zip", "probe\msi")) {
              $exe = Get-ChildItem -Path $stage -Recurse -Filter unterm.exe |
                     Select-Object -First 1
              if (-not $exe) { throw "no unterm.exe inside $stage" }
              $got = (& $exe.FullName --version) -split ' ' | Select-Object -Last 1
              if ($got -ne $expected) {
                throw "$stage ships unterm $got, expected $expected"
              }
              Write-Host "  $stage unterm $got"
            }
          } else {
            # Cross-built arm64 cannot run here; assert the payload is present
            # and let the arm64 install acceptance cover the rest.
            foreach ($stage in @("probe\zip", "probe\msi")) {
              foreach ($name in @("unterm.exe", "unterm-cli.exe", "unterm-core.exe")) {
                if (-not (Get-ChildItem -Path $stage -Recurse -Filter $name |
                          Select-Object -First 1)) {
                  throw "$stage is missing $name"
                }
              }
              Write-Host "  $stage carries all three binaries"
            }
          }
          Remove-Item -Recurse -Force probe -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          # Per-arch name: upload-artifact@v4 rejects duplicate artifact names
          # across matrix jobs.
          name: windows-artifacts-${{ matrix.arch }}
          path: |
            Unterm-windows-*.zip
            dist\Unterm-*.msi
      - name: GitHub Release
        # Publish on push-tag AND workflow_dispatch. The old `if:` guard checked
        # `startsWith(github.ref, 'refs/tags/')` — but workflow_dispatch has a
        # branch ref, not a tag ref, so it silently skipped the upload. Use
        # the resolved tag from the earlier step instead.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          draft: ${{ inputs.draft == 'true' }}
          files: |
            Unterm-windows-*.zip
            dist\Unterm-*.msi
          fail_on_unmatched_files: true
