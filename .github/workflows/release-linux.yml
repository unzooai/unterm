name: release-linux

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag override"
        required: false
      draft:
        description: "publish the release as a draft (for test dispatches; 'true'/'false')"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build:
    # amd64 on the standard runner, arm64 on GitHub's native ubuntu arm runner.
    # The .deb arch (dpkg-architecture) and AppImage arch (uname -m) follow the
    # build host automatically, so the packaging scripts need no arch arg.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"; fi
      - name: Verify the tag names the version being built
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          want="${TAG_NAME#v}"
          have=$(awk '/^\[workspace.package\]/{f=1} f && /^version *=/{gsub(/[",]/,"",$3); print $3; exit}' Cargo.toml)
          if [ "$want" != "$have" ]; then
            echo "tag ${TAG_NAME} does not match the workspace version ${have}." >&2
            echo "A release whose artifacts disagree with their tag is the one" >&2
            echo "kind nobody can reason about afterwards; fix the bump or the tag." >&2
            exit 1
          fi
          echo "tag ${TAG_NAME} matches workspace version ${have}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        # `get-deps` is the authoritative package list for the various Linux
        # distros — running it here keeps the workflow in sync with what the
        # README tells local devs to install. The hand-rolled list this used
        # to ship was missing libx11-xcb-dev / libxcb-ewmh-dev / libxcb-randr0-dev
        # and broke at the x11 crate's pkg-config check.
        run: |
          sudo apt-get update
          SUDO=sudo bash get-deps
      - name: Build
        run: cargo build --release -p unterm-app -p unterm-cli -p unterm-core
      - name: Build .deb
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: ci/deploy.sh
      - name: Build AppImage
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: ci/appimage.sh
      - name: Verify Linux release artifacts
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
          UNTERM_ARCH: ${{ matrix.arch }}
        run: |
          deb="unterm-${TAG_NAME}"
          if [ "$UNTERM_ARCH" != "amd64" ]; then
            deb="${deb}.${UNTERM_ARCH}"
          fi
          deb="${deb}.deb"
          appimages=(Unterm-${TAG_NAME}-*.AppImage)
          if [ ! -f "$deb" ]; then
            echo "missing Linux deb artifact: $deb" >&2
            exit 1
          fi
          if [ "${#appimages[@]}" -ne 1 ] || [ ! -f "${appimages[0]}" ]; then
            echo "missing Linux AppImage artifact for ${TAG_NAME}" >&2
            exit 1
          fi
          echo "Verified Linux artifacts:"
          echo "  $deb"
          echo "  ${appimages[0]}"
          # Existence is not identity. Unpack what is about to be published and
          # ask the binary inside what version it is: a packaging script that
          # stages a stale target/ directory produces a correctly-named archive
          # full of the previous release, and nothing else in this pipeline
          # would notice.
          want="${TAG_NAME#v}"
          rm -rf probe && mkdir -p probe/deb
          dpkg-deb -x "$deb" probe/deb
          for binary in unterm unterm-cli unterm-core ; do
            got=$(probe/deb/usr/bin/$binary --version | awk '{print $NF}')
            if [ "$got" != "$want" ]; then
              echo "deb ships $binary $got, expected $want" >&2
              exit 1
            fi
            echo "  deb $binary $got"
          done
          ( cd probe && ../"${appimages[0]}" --appimage-extract >/dev/null )
          got=$(probe/squashfs-root/usr/bin/unterm --version | awk '{print $NF}')
          if [ "$got" != "$want" ]; then
            echo "AppImage ships unterm $got, expected $want" >&2
            exit 1
          fi
          echo "  AppImage unterm $got"
          rm -rf probe
      - uses: actions/upload-artifact@v4
        with:
          # Per-arch name: upload-artifact@v4 rejects duplicate names across
          # matrix jobs.
          name: linux-artifacts-${{ matrix.arch }}
          path: |
            unterm-*.deb
            Unterm-*.AppImage
      - name: GitHub Release
        # Publish on push-tag AND workflow_dispatch. The old `if:` guard checked
        # `startsWith(github.ref, 'refs/tags/')` — but workflow_dispatch has a
        # branch ref, not a tag ref, so it silently skipped the upload and
        # burned a 10-minute build. Use the resolved tag from the earlier step.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          draft: ${{ inputs.draft == 'true' }}
          files: |
            unterm-*.deb
            Unterm-*.AppImage
          fail_on_unmatched_files: true
