# Unterm 默认配置
#
# 声明式：引擎读它，不执行它。因此配置文件不可能挂住或搞崩启动，
# 也可以在使用前就校验完毕。写错的键会报错并提示最接近的真实键名，
# 不会静默失效。

font_family = "JetBrains Mono"
# 按顺序回退：中文字形交给系统字体，图标交给 Nerd Font。
font_fallback = [
  "PingFang SC",
  "Microsoft YaHei UI",
  "Noto Sans CJK SC",
  "Noto Sans Mono CJK SC",
  "Symbols Nerd Font Mono",
]
font_size = 13
line_height = 1.15

# 配色跟随主题系统（~/.unterm/theme.json）。
color_scheme = "Unterm Dark"

scrollback_lines = 100000
enable_scroll_bar = true

# 标题栏/标签栏由主题色派生：背景抬一点、非活动文字压一点。
# 取代原来 Lua 里的 lighten(bg, 0.05) / darken(fg, 0.35)。
# 调整是按比例的，所以同一组数值在明暗主题下都成立。
[colors]
background = "#111315"
foreground = "#e8eaed"
tab_bar_lift = 0.05
inactive_dim = 0.35

[window]
background_opacity = 1.0
decorations = "INTEGRATED_BUTTONS|RESIZE"
initial_cols = 120
initial_rows = 30
close_confirmation = "NeverPrompt"

[tab_bar]
position = "Left"
max_width = 32
hide_if_only_one_tab = false
show_index = false
show_new_tab_button = true
# 取代 format-tab-title 回调：标题为空或是占位符时退回前台程序名，
# 去掉 .exe，首字母大写，都取不到就叫 Terminal。
title_format = "  {title}  "
fallback_title = "Terminal"
strip_extension = true
capitalize = true

# 标题栏按钮随平台走。base 不设，让每个平台各自声明。
[platform.macos]
title_button.style = "MacOsCustom"
title_button.buttons = ["Close", "Hide", "Maximize"]

[platform.windows]
title_button.style = "Windows"
title_button.alignment = "Right"
# Windows PATH 扩展（Node / Bun / Perl 等常用工具）。
path_append = [
  "C:\Program Files\nodejs",
  "C:\Strawberry\perl\bin",
]

# 其余平台。对应原来 if/elseif 链的 else 分支：只在上面都不匹配时生效。
[platform.other]
title_button.style = "Gnome"
