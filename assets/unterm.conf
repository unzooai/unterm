# Unterm 默认配置
#
# 声明式：引擎读它，不执行它。因此配置文件不可能挂住或搞崩启动，
# 也可以在使用前就校验完毕。写错的键会报错并提示最接近的真实键名，
# 不会静默失效。

font_family = "JetBrains Mono"
# 按顺序回退：中文字形交给系统字体，图标交给 Nerd Font。
font_fallback = [
  "PingFang SC",
  "Microsoft YaHei",
  "Noto Sans CJK SC",
  "Noto Sans Mono CJK SC",
  "Symbols Nerd Font Mono",
]
font_size = 13
line_height = 1.15

# 配色跟随主题系统（~/.unterm/theme.json）。
color_scheme = "Unterm Dark"

scrollback_lines = 100000
enable_scroll_bar = true

# Quick select（Ctrl+Shift+S）的标签字母表。至少 8 个互不重复的字符，
# 大小写不敏感；不合格就警告并退回默认值（即 0.57.4 的默认字母表）。
# quick_select_alphabet = "asdfqwerzxcvjklmiuopghtybn"

# 自定义超链接规则：每条是 [正则, 格式串] 或 [正则, 格式串, 高亮组号]。
# 格式串里 $0 是整个匹配，$1 是第一个捕获组，依此类推；高亮组号指定把
# 哪个捕获组画成链接（默认 0 = 整个匹配）。一旦设置就完全取代内置规则
# （与 0.57.4 一致），产出的 URI 按格式串写的原样打开。
# hyperlink_rules = [
#   ["\b\w+://\S+[_/a-zA-Z0-9-]", "$0"],
#   ["\b[Ii]ssue #?(\d+)", "https://github.com/your/repo/issues/$1"],
# ]

# 标题栏/标签栏由主题色派生：背景抬一点、非活动文字压一点。
# 取代原来 Lua 里的 lighten(bg, 0.05) / darken(fg, 0.35)。
# 调整是按比例的，所以同一组数值在明暗主题下都成立。
[colors]
background = "#111315"
foreground = "#e8eaed"
tab_bar_lift = 0.05
inactive_dim = 0.35

[window]
background_opacity = 1.0
decorations = "INTEGRATED_BUTTONS|RESIZE"
initial_cols = 120
initial_rows = 30
close_confirmation = "NeverPrompt"

[tab_bar]
position = "Left"
max_width = 32
hide_if_only_one_tab = false
show_index = false
show_new_tab_button = true
# 取代 format-tab-title 回调：标题为空或是占位符时退回前台程序名，
# 去掉 .exe，首字母大写，都取不到就叫 Terminal。
title_format = "  {title}  "
fallback_title = "Terminal"
strip_extension = true
capitalize = true

# 标题栏按钮随平台走。base 不设，让每个平台各自声明。
[platform.macos]
title_button.style = "MacOsCustom"
title_button.buttons = ["Close", "Hide", "Maximize"]

[platform.windows]
title_button.style = "Windows"
title_button.alignment = "Right"
# Windows PATH 扩展（Node / Bun / Perl 等常用工具）。
path_append = [
  "C:\Program Files\nodejs",
  "C:\Strawberry\perl\bin",
]

# 其余平台。对应原来 if/elseif 链的 else 分支：只在上面都不匹配时生效。
[platform.other]
title_button.style = "Gnome"

# MCP：AI agent 通过它驱动这个终端。
[mcp]
# 每个 agent 第一次写 pty 时问一次，之后记住。never = 从不问，
# always = 每次都问。
input_confirmation = "first_time_per_agent"
confirmation_timeout_ms = 30000
audit_log_capacity = 1000

# Agent 收件箱：谁在等你。Ctrl+Shift+I 打开。
[cockpit]
enabled = true
auto_checkpoint = true
done_hold_secs = 20

# 自定义键位：修饰键 CTRL/SHIFT/ALT 用 | 连起来，+ 后面是键；同一个组合键
# 覆盖内置绑定，新组合键新增绑定，"None" 表示解绑（交还给 shell）。
# 键可以是单个字符、Left/Right/Up/Down、PageUp/PageDown、Tab、Space、
# F1–F12，以及 Equal/Minus/Plus（= + - 三个键没法直接写）。动作名与
# 命令面板和 MCP meta.keybindings 报告的一致（Copy、Paste、NewTab、
# CommandPalette、SelectTab1…9、FocusPaneLeft…）。写错的动作或组合键
# 会在启动日志里按行号警告，不影响其他绑定。
# [keys]
# CTRL|SHIFT+T = "NewTab"
# CTRL|ALT+Left = "FocusPaneLeft"
# F11 = "None"

# 每个新会话注入的环境变量（原 Lua 配置的 set_environment_variables）。
# [env]
# EDITOR = "vim"
# LANG = "zh_CN.UTF-8"
