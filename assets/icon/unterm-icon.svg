<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    V2 (premium) — refined: U glyph dropped from a solid fill to a
    softened double-pass treatment.
      • outer ghost of the U at 22% opacity gets a wide Gaussian
        blur — reads like the glyph is breathing through the tile
      • inner crisp U is drawn smaller-than-the-blur with a soft
        vertical highlight gradient at 78% peak alpha so it never
        looks like an Apple Frosted Plastic sticker
    Same warm-grey 3-stop tile, same cursor + soft glow, same 1%
    inner stroke as V2.
  -->
  <defs>
    <linearGradient id="tileV3" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1d1d1d"/>
      <stop offset="0.55" stop-color="#141414"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="topLightV3" cx="0.32" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="uShadeV3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f2ee" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d9d6d0" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="uHaze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="cursorGlowV3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14.3" fill="url(#tileV3)"/>
  <rect width="64" height="64" rx="14.3" fill="url(#topLightV3)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.8"
        fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- ghost halo behind the U -->
  <g filter="url(#uHaze)">
    <path d="M15.5 13 h8.5 v22 a8 8 0 0 0 16 0 V13 h8.5 v22.5 a16.5 16.5 0 0 1 -33 0 Z"
          fill="#ffffff" fill-opacity="0.22"/>
  </g>
  <!-- soft inner U -->
  <path d="M15.5 13 h8.5 v22 a8 8 0 0 0 16 0 V13 h8.5 v22.5 a16.5 16.5 0 0 1 -33 0 Z"
        fill="url(#uShadeV3)"/>

  <g filter="url(#cursorGlowV3)">
    <rect x="27.5" y="20" width="9" height="12" rx="1.4" fill="#6fccb8"/>
  </g>
</svg>
