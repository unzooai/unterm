<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Unterm mark — solid negative-space U (the terminal viewport) with the
       teal block cursor floating at the prompt line inside the counter.
       Optical: glyph lifted 1u above geometric center; bowl overshoots the
       stem baseline by 0.5u; tile #171717→#121212 2% top-light. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14.3" fill="url(#tile)"/>
  <path d="M15.5 13 h8.5 v22 a8 8 0 0 0 16 0 V13 h8.5 v22.5 a16.5 16.5 0 0 1 -33 0 Z" fill="#eceae6"/>
  <rect x="27.5" y="20" width="9" height="12" rx="1.4" fill="#6fccb8"/>
</svg>
