  <rect x="0.5" y="0.5" width="63" height="63" rx="13.8"
        fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
  <path d="M15 13 h9 v22 a8 8 0 0 0 16 0 V13 h9 v22.5 a16.5 16.5 0 0 1 -34 0 Z"
        fill="#eceae6"/>
  <rect x="26" y="19" width="12" height="15" rx="1.8" fill="#6fccb8"/>
</svg>
