[package]
name = "unterm-protocol"
version.workspace = true
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
# For `state_dir()`: every process has to agree on where durable state
# lives, and that answer belongs at the compatibility boundary rather
# than being re-derived (and re-diverged) in each crate.
dirs-next.workspace = true

[dev-dependencies]
serde_json.workspace = true
toml.workspace = true
